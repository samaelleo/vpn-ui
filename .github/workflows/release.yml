name: Build & Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    name: Build & Release (Linux amd64)
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'
          check-latest: true

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential gcc python3

      - name: Extract cached bundles and Xray-core
        run: |
          echo "::group::Downloading upstream release for cached bundles..."
          curl -fsSL -o upstream-bin https://github.com/Sir-MmD/vpn-ui/releases/latest/download/vpn-ui-amd64
          chmod +x upstream-bin
          python3 build/extract_bundles.py upstream-bin
          echo "::endgroup::"

      - name: Stamp release version into config/version
        run: |
          ver="${GITHUB_REF_NAME#v}"
          if [ -n "$ver" ]; then
            printf '%s' "$ver" > config/version
          fi
          echo "Embedded panel version: $(cat config/version)"

      - name: Build vpn-ui-amd64 binary
        env:
          GOAMD64: v1
          CGO_CFLAGS: -march=x86-64 -mtune=generic
          CGO_LDFLAGS: -march=x86-64
        run: |
          chmod +x build.sh
          ./build.sh --skip-bundle --skip-core -a amd64
          ls -lh build/out/vpn-ui-amd64

      - name: Ensure baseline ISA level compatibility
        run: |
          python3 -c "
          import struct

          path = 'build/out/vpn-ui-amd64'
          with open(path, 'rb') as f:
              data = bytearray(f.read())

          needle = b'\x02\x80\x00\xc0\x04\x00\x00\x00'
          pos = data.find(needle)
          if pos != -1:
              val_offset = pos + len(needle)
              old_val = struct.unpack('<I', data[val_offset:val_offset+4])[0]
              print(f'Found GNU_PROPERTY_X86_ISA_1_NEEDED at {pos}: {hex(old_val)}')
              if old_val > 1:
                  data[val_offset:val_offset+4] = struct.pack('<I', 1)
                  with open(path, 'wb') as f:
                      f.write(data)
                  print('Patched GNU_PROPERTY_X86_ISA_1_NEEDED to 0x1 (baseline)')
              else:
                  print('Already at baseline (0x1)')
          else:
              print('No GNU_PROPERTY_X86_ISA_1_NEEDED note found (baseline)')
          "

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: build/out/vpn-ui-amd64
          generate_release_notes: true
